name: Composio Health & Credentials Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'

concurrency:
  group: composio-health
  cancel-in-progress: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Composio CLI
        id: install
        run: |
          if curl -fsSL https://composio.dev/install | bash; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Composio CLI install failed upstream (no composio-linux-x64.zip asset in latest release). Skipping CLI checks."
          fi

      - if: steps.install.outputs.installed == 'true'
        run: composio whoami 2>&1 || echo "WHOAMI_FAILED"

      - name: List Connections
        if: steps.install.outputs.installed == 'true'
        run: |
          echo "=== Connections ==="
          composio connections list 2>&1

      - run: echo "Done $(date -u)"
